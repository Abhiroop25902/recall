spring.application.name=recall
spring.config.import=sm@
recall.gcp-project-id=recall-25902
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=recall-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=ASYNC
spring.ai.mcp.server.streamable-http.mcp-endpoint=/v1/mcp
spring.ai.google.genai.embedding.project-id=${recall.gcp-project-id}
spring.ai.google.genai.embedding.location=global
spring.ai.google.genai.embedding.text.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.dimensions=1536
spring.ai.mcp.server.instructions="Recall stores durable context for projects. Set appId to the current project's stable name: use the repository name for code projects, otherwise use the current folder name. Reuse it across agents and devices. Never use the folder path, task name, branch, session ID, or a random value. If the name is ambiguous, ask before retrieving or saving. Use getTopNClosest with the same appId and topN 5-10 to find comparable memories before saving. Use saveMemory for a new durable project or user fact, getMemories only for an explicit full-project audit, and deleteMemory to remove a memory by id. getMemories returns a page with memories (at most 10 records ordered by createdAt then id) and nextCursor. Omit cursor for the first page; pass the server-issued nextCursor unchanged as cursor for subsequent pages. Stop when nextCursor is null; do not reconstruct it from memory timestamps. Read all pages before proposing cleanup; pagination is not a snapshot during concurrent changes. For clear duplicates, keep one canonical memory and delete redundant copies; do not save another. For a clear contradiction, save the replacement and confirm its returned ID before separately deleting the obsolete memory. If a save result is ambiguous, reconcile within the same appId; never blindly retry, and stop for audit if reconciliation is inconclusive. Preserve separate memories when uncertain. Never store secrets, credentials, tokens, or transient conversation details."
