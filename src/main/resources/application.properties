spring.application.name=recall
spring.config.import=sm@
recall.gcp-project-id=recall-25902
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=recall-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=ASYNC
spring.ai.mcp.server.streamable-http.mcp-endpoint=/v1/mcp
spring.ai.mcp.server.instructions="Recall is a personal persistent memory service for OpenCode. Use saveMemory to store durable project or user context, getMemories to retrieve memories scoped by appId, and deleteMemory to remove obsolete memories by id. Keep appId consistent for each application and never store secrets or credentials."
spring.ai.google.genai.embedding.project-id=${recall.gcp-project-id}
spring.ai.google.genai.embedding.location=global
spring.ai.google.genai.embedding.text.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.dimensions=1536
