plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.abhiroop'
version = '0.0.1-SNAPSHOT'
description = 'recall'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation platform('com.google.cloud:libraries-bom:26.86.0')
    implementation 'com.google.cloud:google-cloud-firestore'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc:2.0.0'
    runtimeOnly 'com.google.cloud:spring-cloud-gcp-starter-secretmanager:8.1.0'
    implementation 'org.springframework.security:spring-security-config'
    implementation 'org.springframework.security:spring-security-web'
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding:2.0.1'
}

tasks.named('test') {
    useJUnitPlatform()
}
